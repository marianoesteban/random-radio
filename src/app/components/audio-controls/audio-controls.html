<div class="audio-controls" role="group" aria-label="Audio controls">
  <button
    class="playback-action"
    type="button"
    [disabled]="disabled()"
    (click)="requestPlayback()"
    [attr.aria-label]="isPlaying() ? 'Stop audio' : 'Play audio'"
  >
    @if (isPlaying()) {
      <span class="stop-icon" aria-hidden="true"></span>
    } @else {
      <span class="play-icon" aria-hidden="true"></span>
    }
  </button>

  <div class="volume-control">
    <button
      class="volume-action"
      type="button"
      (click)="requestVolumeToggle()"
      [attr.aria-label]="volumeButtonLabel()"
      [attr.aria-pressed]="isMuted()"
    >
      <svg class="volume-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
        @switch (volumeLevel()) {
          @case ('muted') {
            <path class="muted-mark" d="m16 9 5 5m0-5-5 5"></path>
          }
          @case ('low') {
            <path class="low-wave" d="M16 8.5a5 5 0 0 1 0 7"></path>
          }
          @case ('high') {
            <path class="low-wave" d="M16 8.5a5 5 0 0 1 0 7"></path>
            <path class="high-wave" d="M18.5 6a8.5 8.5 0 0 1 0 12"></path>
          }
        }
      </svg>
    </button>
    <label class="volume-slider">
      <span class="visually-hidden">Volume</span>
      <input
        type="range"
        min="0"
        max="1"
        step="0.05"
        [value]="displayedVolume()"
        (input)="updateVolume($event)"
        (change)="commitVolume($event)"
        [attr.aria-valuetext]="volumeAriaValue()"
      />
    </label>
  </div>
  <span class="volume-value" aria-hidden="true">{{ volumePercent() }}%</span>
</div>
