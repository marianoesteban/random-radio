<app-player-status
  [error]="statusError()"
  [isPlaying]="isStatusPlaying()"
  [isLoading]="isLoading()"
  [isTuning]="isStatusTuning()"
  [hasStation]="activeStation() !== null"
></app-player-status>

@if (activeStation(); as currentStation) {
  <app-station-card
    [station]="currentStation.station"
    [isFavorite]="isFavorite()"
    (favoriteToggled)="favoriteToggled.emit($event)"
  ></app-station-card>

  <app-audio-player
    [disabled]="isLoading()"
    [isTuning]="isLoading()"
    [source]="currentStation.source"
    [autoplay]="currentStation.autoplay"
    (playerStateChanged)="handlePlayerStateChange($event)"
    (playbackStarted)="handlePlaybackStarted(currentStation.station.source)"
    (playbackFailed)="handlePlaybackFailed($event)"
  ></app-audio-player>
}
