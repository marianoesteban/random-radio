@let favorite = station();

<button
  class="favorite-station"
  [class.is-selected]="isSelected()"
  type="button"
  [disabled]="disabled()"
  (click)="selectStation()"
  [attr.aria-current]="isSelected() ? 'true' : null"
  [attr.aria-label]="
    isTuning()
      ? 'Tuning to ' + favorite.name
      : (isSelected() ? 'Play currently selected favorite station ' : 'Play favorite station ') +
        favorite.name
  "
>
  <span class="favorite-image" aria-hidden="true">
    @if (canShowImage()) {
      <img
        [src]="favorite.imageUrl"
        width="36"
        height="36"
        alt=""
        loading="lazy"
        decoding="async"
        (error)="handleImageError()"
      />
    } @else {
      <span class="favorite-image-fallback">RR</span>
    }
  </span>

  <span class="favorite-details">
    <span class="favorite-name" [appTitleOnOverflow]="favorite.name">
      {{ favorite.name }}
    </span>
    <span class="favorite-metadata">
      <span class="favorite-country">
        <app-country-label [countryCode]="favorite.countryCode"></app-country-label>
      </span>
      @if (isTuning()) {
        <span class="selected-indicator">Tuning...</span>
      } @else if (isSelected()) {
        <span class="selected-indicator">Selected</span>
      }
    </span>
  </span>
</button>
