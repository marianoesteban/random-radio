<main class="shell">
  <section class="player" aria-labelledby="page-title">
    <div class="topbar">
      <p class="eyebrow">Random Radio</p>

      <app-favorites-menu
        [favorites]="favoriteStations()"
        [isOpen]="isFavoritesMenuOpen()"
        [isLoading]="isLoading()"
        (menuToggled)="toggleFavoritesMenu()"
        (stationSelected)="playFavoriteStation($event)"
      ></app-favorites-menu>
    </div>

    <h1 id="page-title">Press play and land somewhere on the dial.</h1>

    <button
      class="primary-action"
      type="button"
      [disabled]="isLoading()"
      (click)="playRandomStation()"
    >
      @if (isLoading()) {
        Loading...
      } @else {
        Play a Random Station
      }
    </button>

    <app-player-status
      [error]="error()"
      [isPlaying]="isPlaying()"
      [isLoading]="isLoading()"
      [isTuning]="isTuning()"
      [hasStation]="station() !== null"
    ></app-player-status>

    @if (station(); as currentStation) {
      <app-station-card
        [station]="currentStation"
        [isFavorite]="isCurrentStationFavorite()"
        (favoriteToggled)="toggleFavoriteStation($event)"
      ></app-station-card>

      <app-audio-controls
        [isLoading]="isLoading()"
        [isPlaying]="isPlaying()"
        [volume]="volume()"
        (playbackRequested)="handlePlaybackButton()"
        (volumeChanged)="handleVolumeChange($event)"
      ></app-audio-controls>
    }

    <audio
      #audioPlayer
      class="audio"
      autoplay
      aria-label="Radio station audio player"
      (error)="handleAudioError()"
      (playing)="handleAudioPlaying()"
      (pause)="handleAudioStopped()"
      (ended)="handleAudioStopped()"
    >
      Your browser does not support the audio element.
    </audio>
  </section>
</main>
