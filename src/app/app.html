<main class="shell">
  <section class="player" aria-labelledby="page-title">
    <div class="topbar">
      <p class="eyebrow">Random Radio</p>

      <app-favorites-menu
        [favorites]="favoriteStations()"
        [isOpen]="isFavoritesMenuOpen()"
        [isLoading]="isLoading()"
        (menuToggled)="toggleFavoritesMenu()"
        (stationSelected)="playFavoriteStation($event)"
      ></app-favorites-menu>
    </div>

    <h1 id="page-title">Press play and land somewhere on the dial.</h1>

    <button
      class="primary-action"
      type="button"
      [disabled]="isLoading()"
      (click)="playRandomStation()"
    >
      @if (isLoading()) {
        Loading...
      } @else {
        Play a Random Station
      }
    </button>

    <app-player-status
      [error]="statusError()"
      [isPlaying]="isStatusPlaying()"
      [isLoading]="isLoading()"
      [isTuning]="isStatusTuning()"
      [hasStation]="selection() !== null"
    ></app-player-status>

    @if (selection(); as currentSelection) {
      <app-station-card
        [station]="currentSelection.station"
        [isFavorite]="isCurrentStationFavorite()"
        (favoriteToggled)="toggleFavoriteStation($event)"
      ></app-station-card>

      <app-audio-player
        [disabled]="isLoading()"
        [source]="currentSelection.source"
        (playerStateChanged)="handlePlayerStateChange($event)"
        (playbackStarted)="handlePlaybackStarted(currentSelection.station.stationuuid)"
      ></app-audio-player>
    }
  </section>
</main>
