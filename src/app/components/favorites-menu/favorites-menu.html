<div class="favorites-menu">
  <button
    #menuButton
    class="menu-button"
    type="button"
    aria-controls="favorites-menu-panel"
    [attr.aria-expanded]="isOpen()"
    (click)="toggleMenu()"
  >
    <span class="menu-icon" aria-hidden="true"></span>
    <span>Favorites</span>
    <span class="favorite-count" aria-label="Favorite station count">
      {{ favorites().length }}
    </span>
  </button>

  @if (isOpen()) {
    <section id="favorites-menu-panel" class="favorites-panel" aria-labelledby="favorites-title">
      <h2 id="favorites-title">Favorites</h2>

      @if (favorites().length) {
        <ul class="favorite-list">
          @for (favorite of favorites(); track stationId(favorite)) {
            <li>
              <app-favorite-station-item
                [station]="favorite"
                [disabled]="isLoading()"
                (stationSelected)="selectStation($event)"
              />
            </li>
          }
        </ul>
      } @else {
        <p class="empty-favorites">Your favorite stations will show up here.</p>
      }

      <div class="transfer-actions" role="group" aria-label="Import or export favorites">
        <button
          class="transfer-action"
          type="button"
          [disabled]="favorites().length === 0 || isImporting()"
          (click)="exportFavorites()"
        >
          Export
        </button>

        <label class="transfer-action import-action" [class.is-disabled]="isImporting()">
          <span>{{ isImporting() ? 'Importing...' : 'Import' }}</span>
          <input
            class="file-input"
            type="file"
            accept=".json,application/json"
            [disabled]="isImporting()"
            (change)="importFavorites($event)"
          />
        </label>
      </div>

      @if (transferMessage()) {
        <p
          class="transfer-message"
          [class.transfer-error]="transferFailed()"
          [attr.role]="transferFailed() ? 'alert' : 'status'"
        >
          {{ transferMessage() }}
        </p>
      }
    </section>
  }
</div>
